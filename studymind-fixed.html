  const d=new Date();
  return `sm_day_${d.getFullYear()}_${d.getMonth()+1}_${d.getDate()}`;
}
function loadTodayData(){
  try{const raw=localStorage.getItem(getTodayKey());return raw?JSON.parse(raw):{completedMins:0,microSessions:[],completedSessionIndices:[]};}
  catch(e){return{completedMins:0,microSessions:[],completedSessionIndices:[]};}
}
function saveTodayData(data){
  try{localStorage.setItem(getTodayKey(),JSON.stringify(data));}catch(e){}
}
// Returns days missed since last activity
function getDaysMissed(){
  try{
    const raw=localStorage.getItem("sm_last_active_date");
    if(!raw)return 0;
    const last=new Date(raw);
    const now=new Date();
    last.setHours(0,0,0,0);now.setHours(0,0,0,0);
    const diff=Math.floor((now-last)/(1000*60*60*24));
    return Math.max(0,diff-1);// 0 if active today or yesterday
  }catch(e){return 0;}
}
function markActiveToday(){
  try{localStorage.setItem("sm_last_active_date",new Date().toISOString());}catch(e){}
}
// Break total session hours into micro-chunks of 15-20 mins
function buildMicroSessions(sessionTopic,totalHours,sessionType){
  const totalMins=Math.round(parseFloat(totalHours)||1)*60;
  const chunkSize=totalMins<=20?totalMins:totalMins<=40?20:totalMins<=60?15:totalMins<=90?18:20;
  // Derive short topic keyword — strip subject suffix after em-dash, take first 3 words
  const topicCore=(sessionTopic||"").replace(/\s*[—–-]\s*.*/,"").trim().split(/\s+/).slice(0,3).join(" ");
  // Unique ordered sequences — each label is distinct and topic-specific, never repeats
  const sequences={
    Theory:[
      `Overview: ${topicCore}`,`Core concepts: ${topicCore}`,`Deep read: ${topicCore}`,
      `Take notes: ${topicCore}`,`Summarise: ${topicCore}`,`Connect ideas: ${topicCore}`,`Final review: ${topicCore}`,
    ],
    Practice:[
      `Warm-up: ${topicCore}`,`Guided practice: ${topicCore}`,`Solo drill: ${topicCore}`,
      `Challenge: ${topicCore}`,`Edge cases: ${topicCore}`,`Speed run: ${topicCore}`,`Wrap-up: ${topicCore}`,
    ],
    Quiz:[
      `Quick recall: ${topicCore}`,`Practice Qs: ${topicCore}`,`Hard Qs: ${topicCore}`,
      `Review mistakes: ${topicCore}`,`Final self-test: ${topicCore}`,
    ],
    Review:[
      `Skim notes: ${topicCore}`,`Active recall: ${topicCore}`,`Fill gaps: ${topicCore}`,
      `Teach back: ${topicCore}`,`Spaced review: ${topicCore}`,
    ],
    Project:[
      `Plan: ${topicCore}`,`Build pt.1: ${topicCore}`,`Build pt.2: ${topicCore}`,
      `Test & fix: ${topicCore}`,`Polish: ${topicCore}`,`Document: ${topicCore}`,
    ],
  };
  const labels=sequences[sessionType]||sequences.Theory;
  const chunks=[];
  let remaining=totalMins;
  let idx=0;
  while(remaining>0){
    const dur=Math.min(chunkSize,remaining);
    chunks.push({id:idx+1,label:labels[idx]||`Part ${idx+1}: ${topicCore}`,mins:dur,done:false});
    remaining-=dur;
    idx++;
  }
  return chunks;
}

/* ─── TODAY'S SCHEDULE WIDGET ──────────────────────────── */
function TodayScheduleWidget({plan,setPlan,addXP,add,activeSubject}){
  const[todayData,setTodayData]=useState(()=>loadTodayData());
  const[expanded,setExpanded]=useState(true);
  const[missedWarning,setMissedWarning]=useState(null);

  const todayStr=new Date().toLocaleDateString('en',{weekday:'long',month:'short',day:'numeric'});
  const daysMissed=getDaysMissed();

  // Mark app active when widget loads
  useEffect(()=>{
    markActiveToday();
    // detect days missed and show warning
    if(daysMissed>0){
      setMissedWarning(daysMissed);
    }
  },[]);

  // Persist today data on change
  useEffect(()=>{saveTodayData(todayData);},[todayData]);

  // Find next/current plan session(s) to work on today
  const nextSession=plan.find(d=>d.status==="todo"&&!todayData.completedSessionIndices.includes(plan.indexOf(d)));
  const nextIdx=nextSession?plan.indexOf(nextSession):-1;

  // Build micro-sessions for next plan session if not done
  const microSessions=useMemo(()=>{
    if(!nextSession)return[];
    // Check if we already built them for this session
    if(todayData.microSessions&&todayData.microSessions.length>0&&todayData.microSessions[0].sessionIdx===nextIdx){
      return todayData.microSessions;
    }
    const chunks=buildMicroSessions(nextSession.topic,parseFloat(nextSession.duration)||1,nextSession.type||"Theory");
    return chunks.map(c=>({...c,sessionIdx:nextIdx}));
  },[nextSession,nextIdx]);

  // If we have new micro-sessions (different from stored), update
  useEffect(()=>{
    if(microSessions.length>0&&(todayData.microSessions.length===0||todayData.microSessions[0]?.sessionIdx!==nextIdx)){
      setTodayData(prev=>({...prev,microSessions}));
    }
  },[nextIdx]);

  const totalMinsTarget=microSessions.reduce((s,m)=>s+m.mins,0);

/* ─── DYNAMIC SCHEDULER ────────────────────────────────── */
// Detects if sessions should be marked behind based on real date vs plan order
function useDynamicScheduler(plan,setPlan,profile){
  useEffect(()=>{
    if(!plan||plan.length===0||!profile)return;
    const daysMissed=getDaysMissed();
    if(daysMissed<=0)return;
    // Mark sessions behind if user was away > 1 day
    const todoDays=plan.filter(d=>d.status==="todo");
    const missedCount=Math.min(daysMissed,todoDays.length,3);// cap at 3 auto-behind
    if(missedCount>0){
      const indicesToMark=todoDays.slice(0,missedCount).map(d=>plan.indexOf(d));
      setPlan(p=>p.map((d,i)=>indicesToMark.includes(i)?{...d,status:"behind"}:d));
    }
  },[]);// run once on mount
}

/* ─── AUTH PARTICLES CANVAS ───────────────────────────── */
function AuthParticles(){
  const canvasRef=useRef(null);
  useEffect(()=>{
    const canvas=canvasRef.current;if(!canvas)return;
    const ctx=canvas.getContext("2d");
    let W=canvas.width=window.innerWidth,H=canvas.height=window.innerHeight;
    const resize=()=>{W=canvas.width=window.innerWidth;H=canvas.height=window.innerHeight;};
    window.addEventListener("resize",resize);
    const COLORS=["rgba(200,68,10,","rgba(232,99,30,","rgba(91,63,160,","rgba(13,115,119,","rgba(255,255,255,"];
    const particles=Array.from({length:80},()=>({
      x:Math.random()*W,y:Math.random()*H,
      vx:(Math.random()-0.5)*0.4,vy:(Math.random()-0.5)*0.4,
      r:Math.random()*2+0.5,
      color:COLORS[Math.floor(Math.random()*COLORS.length)],
      alpha:Math.random()*0.5+0.1,
      pulse:Math.random()*Math.PI*2,
      pulseSpeed:0.02+Math.random()*0.03,
    }));
    // Connection lines between nearby particles
    let frame;
    const draw=()=>{
      ctx.clearRect(0,0,W,H);
      // Draw connections
      for(let i=0;i<particles.length;i++){
        for(let j=i+1;j<particles.length;j++){
          const dx=particles[i].x-particles[j].x,dy=particles[i].y-particles[j].y;
          const dist=Math.sqrt(dx*dx+dy*dy);
          if(dist<120){
            ctx.beginPath();
            ctx.moveTo(particles[i].x,particles[i].y);
            ctx.lineTo(particles[j].x,particles[j].y);
            ctx.strokeStyle=`rgba(200,68,10,${0.06*(1-dist/120)})`;
            ctx.lineWidth=0.5;
            ctx.stroke();
          }
        }
      }
      // Draw particles
      particles.forEach(p=>{
        p.pulse+=p.pulseSpeed;
        const a=p.alpha*(0.7+0.3*Math.sin(p.pulse));
        ctx.beginPath();
        ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
        ctx.fillStyle=p.color+a+")";
        ctx.fill();
        // Glow for brighter particles
        if(a>0.4){
          ctx.beginPath();
          ctx.arc(p.x,p.y,p.r*3,0,Math.PI*2);
          ctx.fillStyle=p.color+(a*0.15)+")";
          ctx.fill();
        }
        p.x+=p.vx;p.y+=p.vy;
        if(p.x<0)p.x=W;if(p.x>W)p.x=0;
        if(p.y<0)p.y=H;if(p.y>H)p.y=0;
      });
      frame=requestAnimationFrame(draw);
    };
    draw();
    return()=>{cancelAnimationFrame(frame);window.removeEventListener("resize",resize);};
  },[]);
  return React.createElement('canvas', { ref: canvasRef, style: {position:"absolute",inset:0,pointerEvents:"none",zIndex:0},});
}

// Converts any resource field + topic into a Google search query URL.
// This way links always work and land somewhere useful, regardless of
// whether the AI returned a real URL or a placeholder.
function resourceSearchUrl(resource, topic) {
  // Extract the site name from a URL if one was given (e.g. "coursera.org")
  let sitePart = "";
  try {
    const url = new URL(resource);
    // Use the hostname without www as the site hint
    sitePart = url.hostname.replace(/^www\./, "");
  } catch(e) {
    // resource wasn't a valid URL — use it as a plain keyword if it looks meaningful
    if (resource && resource.length > 3 && !resource.startsWith("http")) {
      sitePart = resource;
    }
  }
  const query = sitePart
    ? `${topic} ${sitePart}`
    : `${topic} tutorial`;
  return "https://www.google.com/search?q=" + encodeURIComponent(query);
}

  const gapDays=useMemo(()=>{
    if(!_optionalChain([lastDone, 'optionalAccess', _107 => _107.completedAt])) return 0;
    const last=new Date(lastDone.completedAt);
    const now=new Date();

function Quiz({profile,add,addXP,plan,activeSubject}){
  const subjects=profile.subjects||[profile.subject].filter(Boolean);
  const lessons=(plan||[]).map(d=>d.topic).filter(Boolean);

  const[q,setQ]=useState(null);
  const[loading,setLoading]=useState(false);
  const[sel,setSel]=useState(null);
  const[revealed,setRevealed]=useState(false);
  const[score,setScore]=useState({right:0,wrong:0,total:0});
  const[error,setError]=useState("");
  const[numQuestions,setNumQuestions]=useState(5);
  const[sessionQs,setSessionQs]=useState([]);// all Qs in session
  const[sessionIdx,setSessionIdx]=useState(0);// current Q index in session
  const[inSession,setInSession]=useState(false);
  const[sessionDone,setSessionDone]=useState(false);
  const[selectedSubj,setSelectedSubj]=useState(activeSubject||subjects[0]||"General");
  // Auto-switch quiz subject when activeSubject changes
  useEffect(()=>{if(activeSubject)setSelectedSubj(activeSubject);},[activeSubject]);
  const[selectedLesson,setSelectedLesson]=useState("general");
  const[mistakes,setMistakes]=useState([]);// track wrong answers for analysis

  // On mount, check if a topic was pre-selected via the dashboard quiz CTA
  useEffect(()=>{
    try{
      const preselected=sessionStorage.getItem("sm_quiz_topic");
      if(preselected){
        sessionStorage.removeItem("sm_quiz_topic");
        // Try to match to a plan lesson
        const match=(plan||[]).find(d=>d.topic===preselected);
        if(match){
          setSelectedLesson(preselected);
          setUseCustomTopic(false);
        } else {
          // Use as custom topic
          setCustomTopic(preselected);
          setUseCustomTopic(true);
        }
      }
    }catch(e){}
  },[]);

  const usedQsRef=useRef(new Set());// track used question texts globally

  const[customTopic,setCustomTopic]=useState("");
  const[useCustomTopic,setUseCustomTopic]=useState(false);

  // Suggest topics based on completed plan sessions (progress-aware)
  const donePlanTopics=useMemo(()=>(plan||[]).filter(d=>d.status==="done"&&d.topic).map(d=>d.topic),[plan]);
  const todoPlanTopics=useMemo(()=>(plan||[]).filter(d=>d.status==="todo"&&d.topic).map(d=>d.topic).slice(0,5),[plan]);

  const TOPIC_POOLS={
    "Machine Learning":["supervised vs unsupervised learning","neural network architecture","backpropagation","gradient descent variants","overfitting and regularization","convolutional neural networks","recurrent neural networks","transfer learning","evaluation metrics for ML","feature engineering","bias-variance tradeoff","decision trees and random forests","support vector machines","k-means and DBSCAN clustering","attention mechanisms and transformers"],
    "Web Development":["HTML5 semantic elements","CSS grid vs flexbox","JavaScript event loop","promises and async/await","RESTful API design","React component lifecycle","hooks: useState useEffect","HTTP status codes","browser rendering pipeline","web accessibility (WCAG)","CORS and security headers","JWT authentication","responsive design patterns","service workers and PWA","webpack and bundling"],
    "Python":["list comprehensions and generators","decorators and closures","context managers (with statement)","class inheritance and MRO","itertools and functools","Python memory model","error handling best practices","asyncio and concurrency","dataclasses and namedtuples","type hints and mypy","virtual environments","testing with pytest","Python standard library","metaclasses","walrus operator and modern syntax"],
    "Data Science":["Pandas DataFrames and operations","NumPy broadcasting","data cleaning techniques","exploratory data analysis","statistical hypothesis testing","correlation vs causation","data visualization principles","SQL for data analysis","feature selection methods","cross-validation","imbalanced datasets","time series analysis","A/B testing","Bayesian vs frequentist statistics","dimensionality reduction"],
    "Mathematics":["limits and continuity","differentiation rules","integration techniques","matrix operations","eigenvalues and eigenvectors","probability distributions","Bayes theorem","combinatorics","number theory","graph theory basics","differential equations","Fourier transforms","topology concepts","group theory","mathematical induction"],
    "Physics":["Newton's laws of motion","electromagnetism fundamentals","wave-particle duality","thermodynamics laws","special relativity","quantum mechanics basics","optics and light","fluid dynamics","nuclear physics","astrophysics concepts"],
    "Chemistry":["periodic table trends","chemical bonding","acid-base equilibria","oxidation-reduction reactions","thermochemistry","kinetics and rate laws","organic functional groups","electrochemistry","nuclear chemistry","coordination compounds"],
    "General":["critical thinking","problem decomposition","scientific method","research methodology","time management","spaced repetition","Feynman technique","cognitive biases","first principles thinking","systems thinking"],
  };

  const genSession=async()=>{
    setLoading(true);setError("");setSessionQs([]);setSessionIdx(0);setSessionDone(false);setMistakes([]);
    usedQsRef.current.clear();
    // If user typed a custom topic, use it exclusively; otherwise use pool
    const effectiveTopic=useCustomTopic&&customTopic.trim()?customTopic.trim():null;
    const topicPool=effectiveTopic?[effectiveTopic]:TOPIC_POOLS[selectedSubj]||TOPIC_POOLS.General;
    const lessonContext=effectiveTopic?`Focus ONLY on: "${effectiveTopic}".`:selectedLesson!=="general"?`Specifically about: "${selectedLesson}".`:`Across various topics in ${selectedSubj}.`;
    const shuffledPool=[...topicPool].sort(()=>Math.random()-0.5);
    const questions=[];
    const qTypes=["conceptual understanding","practical application","common misconception trap","comparison or contrast","real-world application","definition or terminology","cause and effect","edge case or exception"];
    const diffs=["foundational","intermediate","applied","challenging"];

    for(let i=0;i<numQuestions;i++){
      const topic=shuffledPool[i%shuffledPool.length];
      const qType=qTypes[i%qTypes.length];
      const diff=diffs[Math.floor(i/(numQuestions/4))%4];
      const usedList=Array.from(usedQsRef.current).slice(-10).join(" | ");
      try{
        let full="";
        await callAI(
          "You are a quiz generator. Output ONLY raw JSON. No markdown, no explanation, just the JSON object.",
          `Generate a UNIQUE multiple-choice quiz question for "${selectedSubj}" (${profile.level} level).
${lessonContext}
Topic: "${topic}" | Type: ${qType} | Difficulty: ${diff} | Question #${i+1} of ${numQuestions}.
Previously used questions (DO NOT repeat similar content): ${usedList||"none"}.
STRICT RULES: 1) Each question must be completely different from previous ones. 2) All 4 options must be plausible. 3) Explanation must be educational (2-3 sentences). 4) Correct index must be random (not always 0).
Return ONLY: {"question":"...","options":["A text","B text","C text","D text"],"correct":2,"explanation":"Detailed 2-3 sentence explanation of why the answer is correct and why others are wrong.","topic":"${topic}"}`,
          t=>{full=t;}
        );
        const c=full.replace(/```json|```/g,"").trim();
        const parsed=JSON.parse(c);
        if(parsed.question&&!usedQsRef.current.has(parsed.question)){
          usedQsRef.current.add(parsed.question);
          questions.push({...parsed,id:i});
        }
      }catch(e){console.error("Q gen error",e);}
    }
    if(questions.length===0){setError("Couldn't generate quiz questions. Check your connection.");setLoading(false);return;}
    setSessionQs(questions);setSessionIdx(0);setInSession(true);
    setLoading(false);
  };

  const curQ=sessionQs[sessionIdx];

  const check=(i)=>{
    if(revealed||!curQ)return;
    setSel(i);setRevealed(true);
    const correct=i===curQ.correct;
    if(correct){setScore(s=>({...s,right:s.right+1,total:s.total+1}));addXP(15);add("Correct! +15 XP","xp","⭐");}
    else{
      setScore(s=>({...s,wrong:s.wrong+1,total:s.total+1}));
      setMistakes(m=>[...m,{question:curQ.question,topic:curQ.topic,yourAnswer:curQ.options[i],correct:curQ.options[curQ.correct],explanation:curQ.explanation}]);
      add("Incorrect — read the explanation carefully","warn","📚");
    }
  };

  const nextQ=()=>{
    if(sessionIdx+1>=sessionQs.length){setSessionDone(true);}
    else{setSessionIdx(n=>n+1);setSel(null);setRevealed(false);setQ(null);}
  };

  const resetQuiz=()=>{setInSession(false);setSessionDone(false);setSessionQs([]);setSessionIdx(0);setSel(null);setRevealed(false);setScore({right:0,wrong:0,total:0});setMistakes([]);};

  const pct=score.total>0?Math.round(score.right/score.total*100):0;

  return(
    React.createElement('div', { className: "page",}
      , React.createElement('div', { className: "page-header",}
        , React.createElement('div', { style: {display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:10},}
          , React.createElement('div', null
            , React.createElement('h2', { style: {display:"flex",alignItems:"center",gap:8},}, "AI Quiz" , activeSubject&&React.createElement('span', { style: {fontSize:13,fontWeight:600,color:"var(--purple)",padding:"3px 12px",background:"var(--purple-light)",borderRadius:20,border:"1px solid rgba(91,63,160,0.2)"},}, activeSubject))
            , React.createElement('p', null, "Adaptive quizzes with mistake analysis · "      , React.createElement('strong', null, activeSubject||subjects.join(", ")))
          )
          , inSession&&!sessionDone&&(
            React.createElement('div', { style: {display:"flex",gap:12,alignItems:"center"},}
              , React.createElement('div', { style: {display:"flex",gap:8},}
                , React.createElement('span', { style: {fontSize:13,color:"var(--green)",fontWeight:800,display:"flex",alignItems:"center",gap:4},}, React.createElement(Icon, { name: "CheckCircle2", size: 14,}), "  "  , score.right)
                , React.createElement('span', { style: {fontSize:13,color:"var(--red)",fontWeight:800,display:"flex",alignItems:"center",gap:4},}, React.createElement(Icon, { name: "XCircle", size: 14,}), "  "  , score.wrong)
              )
              , React.createElement('div', { style: {fontSize:12,color:"var(--ink3)",fontWeight:600},}, "Q " , sessionIdx+1, "/", sessionQs.length)
              , React.createElement('button', { className: "btn btn-sm btn-ghost"  , onClick: resetQuiz,}, React.createElement(Icon, { name: "X", size: 12,}), "End")
            )
          )
        )
      )

      /* Setup screen */
      , !inSession&&!loading&&(
        React.createElement('div', { style: {display:"grid",gridTemplateColumns:"1fr 1fr",gap:14},}
          , React.createElement('div', { className: "card cw" ,}
            , React.createElement('div', { className: "card-title",}, React.createElement(Icon, { name: "Settings2", size: 13,}), "Quiz Settings" )
            , React.createElement('div', { className: "form-group",}
              , React.createElement('label', { className: "form-label",}, "Subject")
              , React.createElement('div', { style: {display:"flex",flexWrap:"wrap",gap:6},}
                , subjects.map(s=>(
                  React.createElement('button', { key: s, className: `chip ${selectedSubj===s?"selected":""}`, onClick: ()=>setSelectedSubj(s),}, s)
                ))
              )
            )
            , React.createElement('div', { className: "form-group",}
              , React.createElement('label', { className: "form-label",}, "Lesson / Topic (optional)"   )
              , React.createElement('select', { value: selectedLesson, onChange: e=>setSelectedLesson(e.target.value), style: {width:"100%"},}
                , React.createElement('option', { value: "general",}, "General — All Topics"   )
                , lessons.map((l,i)=>React.createElement('option', { key: i, value: l,}, l.length>60?l.slice(0,60)+"…":l))
              )
            )
            , React.createElement('div', { className: "form-group",}
              , React.createElement('label', { className: "form-label",}, "Number of Questions"  )
              , React.createElement('div', { style: {display:"flex",gap:6,flexWrap:"wrap"},}
                , [3,5,8,10,15].map(n=>(
                  React.createElement('button', { key: n, className: `chip ${numQuestions===n?"selected":""}`, onClick: ()=>setNumQuestions(n),}, n)

            /* Custom topic input */
            , React.createElement('div', { className: "form-group",}
              , React.createElement('label', { className: "form-label", style: {display:"flex",alignItems:"center",justifyContent:"space-between"},}
                , React.createElement('span', null, "Custom Topic (optional)"  )
                , React.createElement('label', { style: {display:"flex",alignItems:"center",gap:5,fontSize:11,fontWeight:600,cursor:"pointer"},}
                  , React.createElement('input', { type: "checkbox", checked: useCustomTopic, onChange: e=>setUseCustomTopic(e.target.checked), style: {width:12,height:12},}), "Use custom"

                )
              )
              , React.createElement('input', { type: "text", placeholder: "e.g. Backpropagation, CSS Flexbox, Organic Chemistry…"     , value: customTopic,
                onChange: e=>setCustomTopic(e.target.value),
                onFocus: ()=>setUseCustomTopic(true),
                style: {fontSize:13,transition:"border 0.2s",borderColor:useCustomTopic&&customTopic?"var(--purple)":"var(--paper3)"},})

            , (donePlanTopics.length>0||todoPlanTopics.length>0)&&(
              React.createElement('div', { style: {marginBottom:12},}
                , donePlanTopics.length>0&&(
                  React.createElement('div', { style: {marginBottom:8},}
                    , React.createElement('div', { style: {fontSize:10,fontWeight:800,color:"var(--green)",textTransform:"uppercase",letterSpacing:0.8,marginBottom:5,display:"flex",alignItems:"center",gap:4},}, React.createElement(Icon, { name: "CheckCircle2", size: 10,}), "Quiz on completed topics"   )

  const[customMins,setCustomMins]=useState(25);
  const[customBreak,setCustomBreak]=useState(5);
  const[totalSecs,setTotalSecs]=useState(25*60);
  const[secsLeft,setSecsLeft]=useState(25*60);
  const[running,setRunning]=useState(false);
  const[mode,setMode]=useState("focus");// focus | break
  const[sessions,setSessions]=useState(0);
  const[totalFocusSecs,setTotalFocusSecs]=useState(0);
  const[task,setTask]=useState("");
  const[showCustom,setShowCustom]=useState(false);
  const[history,setHistory]=useState([]);

  // Use refs to capture latest values inside interval closure
  const modeRef=useRef(mode);
  const customMinsRef=useRef(customMins);
  const customBreakRef=useRef(customBreak);
  const totalSecsRef=useRef(totalSecs);
  const taskRef=useRef(task);
  useEffect(()=>{modeRef.current=mode;},[mode]);
  useEffect(()=>{customMinsRef.current=customMins;},[customMins]);
  useEffect(()=>{customBreakRef.current=customBreak;},[customBreak]);
  useEffect(()=>{totalSecsRef.current=totalSecs;},[totalSecs]);
  useEffect(()=>{taskRef.current=task;},[task]);

  // Listen for micro-session start events, and also check sessionStorage on mount
  // (sessionStorage handles the race where the event fires before this component is mounted)
  useEffect(()=>{
    const applyMicro=(mins,t,autoStart)=>{
      setRunning(false);setMode("focus");
      setCustomMins(mins);setCustomBreak(5);
      setTotalSecs(mins*60);setSecsLeft(mins*60);
      setTask(t);
      if(autoStart){setTimeout(()=>setRunning(true),150);}
    };
    // On mount, pick up any session queued before we were rendered
    try{
      const queued=sessionStorage.getItem("sm_pending_micro");
      if(queued){
        sessionStorage.removeItem("sm_pending_micro");
        const{mins,task:t,autoStart}=JSON.parse(queued);
        if(mins&&t) applyMicro(mins,t,autoStart);
      }
    }catch(e){}
    // Also keep listening for in-session events (e.g. if timer tab is already open)
    const handler=(e)=>{
      const{mins,task:t,autoStart}=e.detail||{};
      if(mins&&t) applyMicro(mins,t,autoStart);

    window.addEventListener("studymind-start-micro",handler);
    return()=>window.removeEventListener("studymind-start-micro",handler);

  const mins=Math.floor(secsLeft/60);
  const secs=secsLeft%60;
  const pct=totalSecs>0?Math.max(0,Math.min(1,(totalSecs-secsLeft)/totalSecs)):0;
  const R=85;const circ=2*Math.PI*R;
  const dashOff=circ*(1-pct);

  useEffect(()=>{
    if(!running)return;
    const t=setInterval(()=>{

        if(s>1)return s-1;

        setRunning(false);
        if(modeRef.current==="focus"){
          const focusMins=Math.round(totalSecsRef.current/60);
          setSessions(p=>p+1);
          setTotalFocusSecs(p=>p+totalSecsRef.current);
          const earnedXP=Math.max(10,Math.round(focusMins/5)*5);
          addXP(earnedXP);
          add(`Focus session complete! +${earnedXP} XP 🎉`,"xp","⏱");
          playBeep();
          const brkSecs=customBreakRef.current*60;
          setMode("break");setTotalSecs(brkSecs);setSecsLeft(brkSecs);
          setHistory(h=>[...h,{task:taskRef.current||"Focus session",subject:activeSubject||"General",mins:focusMins,at:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}]);
        }else{
          setMode("focus");
          const focusSecs=customMinsRef.current*60;
          setTotalSecs(focusSecs);setSecsLeft(focusSecs);
          add("Break done — focus time! 🔥","info","✦");
          playBeep();
        }
        return 0;

    },1000);
    return()=>clearInterval(t);
  },[running]);

  const applyPreset=(f,b)=>{
    setRunning(false);setMode("focus");
    setCustomMins(f);setCustomBreak(b);

          , React.createElement('div', null
            , React.createElement('h2', { style: {display:"flex",alignItems:"center",gap:8},}, "Focus Timer"

              , activeSubject&&React.createElement('span', { style: {fontSize:13,fontWeight:600,color:"var(--teal)",padding:"3px 12px",background:"var(--teal-light)",borderRadius:20,border:"1px solid rgba(13,115,119,0.2)"},}, activeSubject)

  // For subjects not in RESOURCES, generate a smart fallback
  const getSmartResource=(subj)=>{
    const sl=(subj||"").toLowerCase();
    if(/python|javascript|typescript|java|c\+\+|rust|go|swift|kotlin|ruby|php/.test(sl))return RESOURCES["Web Development"]||RESOURCES["General"];
    if(/react|vue|angular|next|svelte|node/.test(sl))return RESOURCES["Web Development"]||RESOURCES["General"];
    if(/ml|machine learn|deep learn|ai|neural|llm|nlp/.test(sl))return RESOURCES["Machine Learning"]||RESOURCES["General"];
    if(/data scien|pandas|numpy|tableau|power bi/.test(sl))return RESOURCES["Data Science"]||RESOURCES["General"];
    if(/math|calcul|algebra|linear algebra|statistics|probab/.test(sl))return RESOURCES["Mathematics"]||RESOURCES["General"];
    if(/physics/.test(sl))return RESOURCES["Physics"]||RESOURCES["General"];
    if(/chemistry/.test(sl))return RESOURCES["Chemistry"]||RESOURCES["General"];
    if(/design|figma|ux|ui|illustrat/.test(sl))return RESOURCES["Design"]||RESOURCES["General"];
    if(/guitar|music|piano|violin|drum|composition/.test(sl))return RESOURCES["Guitar"]||RESOURCES["General"];
    if(/photo|camera|lightroom|photoshop/.test(sl))return RESOURCES["Photography"]||RESOURCES["General"];
    if(/market|seo|ads|brand|social media/.test(sl))return RESOURCES["Marketing"]||RESOURCES["General"];
    if(/upsc|ias|ips|civil service/.test(sl))return RESOURCES["UPSC"]||RESOURCES["General"];
